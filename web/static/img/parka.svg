<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hoodTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="480" height="360" fill="url(#studioBg)"/>
  <ellipse cx="240" cy="322" rx="115" ry="12" fill="#94a3b8" opacity="0.35"/>

  <g filter="url(#dropShadow)">
    <!-- Insulated Storm Hood -->
    <path d="M178 82 C178 44 302 44 302 82 C318 92 326 110 322 128 C316 144 298 150 282 145 C272 118 258 106 240 106 C222 106 208 118 198 145 C182 150 164 144 158 128 C154 110 162 92 178 82 Z" fill="url(#hoodTrim)" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="240" cy="95" rx="38" ry="40" fill="#0f172a"/>

    <!-- Parka Outer Shell -->
    <path d="M182 118 L134 166 L116 282 L156 290 L174 202 L178 308 L302 308 L306 202 L324 290 L364 282 L346 166 L298 118 Z" fill="url(#shellGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Baffle Quilting Lines -->
    <line x1="178" y1="168" x2="302" y2="168" stroke="#334155" stroke-width="1.2" opacity="0.7"/>
    <line x1="176" y1="210" x2="304" y2="210" stroke="#334155" stroke-width="1.2" opacity="0.7"/>
    <line x1="177" y1="252" x2="303" y2="252" stroke="#334155" stroke-width="1.2" opacity="0.7"/>

    <!-- Waterproof AquaGuard Center Zipper -->
    <line x1="240" y1="115" x2="240" y2="308" stroke="#0070ba" stroke-width="3"/>
    <rect x="237" y="142" width="6" height="14" rx="2" fill="#38bdf8"/>

    <!-- Chest Welted Pockets -->
    <rect x="192" y="156" width="30" height="38" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <rect x="258" y="156" width="30" height="38" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <line x1="196" y1="163" x2="218" y2="163" stroke="#38bdf8" stroke-width="2"/>
    <line x1="262" y1="163" x2="284" y2="163" stroke="#38bdf8" stroke-width="2"/>

    <!-- Cargo Storm Pockets -->
    <rect x="186" y="232" width="38" height="48" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <rect x="256" y="232" width="38" height="48" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Editorial Spec Pills -->
  <rect x="20" y="20" width="136" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="35" cy="34" r="4" fill="#0070ba"/>
  <text x="46" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">800-FILL GOOSE DOWN</text>

  <rect x="342" y="20" width="118" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="401" y="38" fill="#475569" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" text-anchor="middle">-30°C EXTREME</text>
</svg>
