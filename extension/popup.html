<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FairDeal Buyer Agent</title>
  <style>
    body {
      width: 370px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e8e6de;
      color: #1a2028;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 16px;
    }
    .logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #222831;
      color: #d6fb38;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }
    .card {
      background: #faf9f4;
      border: 1px solid #dad6cc;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(34, 40, 49, 0.05);
    }
    .btn {
      width: 100%;
      background: #d6fb38;
      color: #131920;
      border: none;
      border-radius: 999px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .offer-item {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      background: #f8fafc;
      font-size: 12px;
    }
    .offer-item strong { color: #059669; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo">F</span>
      <span>FairDeal Agent</span>
    </div>
    <span style="font-size:11px;background:#222831;color:#d6fb38;padding:3px 8px;border-radius:99px;font-weight:600;">
      Sandbox demo
    </span>
  </div>

  <div class="card">
    <div style="font-size:11px;color:#748092;font-weight:500;text-transform:uppercase;">Five fictional merchants</div>
    <div id="ext-savings" style="font-size:20px;font-weight:400;font-family:monospace;color:#1a2028;margin-top:2px;">Budget stays private</div>
    <div style="font-size:11px;color:#748092;">"Fair for both: I choose, you choose"</div>
  </div>

  <div class="card">
    <label style="font-size:12px;font-weight:500;display:block;margin-bottom:4px;">Max Target Budget ($ USD):</label>
    <input id="ext-budget" type="number" value="130" style="width:100%;padding:6px;border:1px solid #dad6cc;border-radius:6px;margin-bottom:8px;background:#ffffff;">
    <button id="ext-negotiate" class="btn">Find a FairDeal Offer →</button>
    <div id="ext-results"></div>
  </div>

  <label>FairDeal server <select id="ext-server"><option value="https://fairdeal-5h0w.onrender.com">Hosted Sandbox demo</option><option value="http://localhost:8080">Local development</option></select></label><button id="ext-open" class="btn">Open full workspace</button>
<script type="module" src="popup.js"></script>
</body>
</html>
